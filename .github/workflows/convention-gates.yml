# Convention gates — AI-CODING-CONVENTIONS.md v2 §18 + Agentic Build Framework v1.5
# Fails the PR on: type errors, NEW size violations or ratchet regressions,
# lint errors in changed files (ratcheted, like E13/E14), failing unit tests,
# untested new code or a surviving mutant (E13),
# a NEW unwired module beyond the wiring baseline (E14), or a stale/hand-edited
# provenance log (E11). Legacy files frozen in quality-baseline.json do not fail
# the build unless they grow; unwired modules frozen in wiring-baseline.json do
# not fail the build unless a new one appears.

name: Convention Gates

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  gates:
    name: types / sizes+ratchet / lint / unit / E13 / E14 / E11
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # E13 test-link diffs against the base commit

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Types (tsc --noEmit)
        run: npm run check:types

      - name: File sizes + quality ratchet
        run: npm run check:sizes

      - name: Lint (changed files — ratcheted)
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -n "$BASE" ]; then
            FILES=$(git diff --name-only --diff-filter=AM "$BASE"...HEAD -- 'src/**/*.ts' 'src/**/*.tsx' 'src/**/*.js' 'src/**/*.jsx' | tr '\n' ' ')
          else
            FILES=""
          fi
          if [ -n "$FILES" ]; then
            ARGS=""; for f in $FILES; do ARGS="$ARGS --file $f"; done
            npx next lint $ARGS
          else
            echo "no changed source files to lint"
          fi

      - name: Unit tests (vitest)
        run: npx vitest run

      # --- Agentic Build Framework v1.5 gates ---

      - name: Test-effectiveness — new code is test-linked (E13)
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -n "$BASE" ]; then
            FILES=$(git diff --name-only --diff-filter=AM "$BASE"...HEAD -- 'src/**/*.ts' 'src/**/*.tsx' | tr '\n' ' ')
          else
            FILES=""
          fi
          if [ -n "$FILES" ]; then
            node docs/build-provenance/check-testlink.mjs src tests $FILES --baseline docs/build-provenance/testlink-baseline.json
          else
            echo "no changed source files to test-link"
          fi

      - name: Test-effectiveness — mutation sample on critical modules (E13)
        run: node docs/build-provenance/check-mutation.mjs --config docs/build-provenance/mutation-targets.json

      - name: Wired-path — no new unwired module (E14)
        run: node docs/build-provenance/check-wiring.mjs src --baseline docs/build-provenance/wiring-baseline.json

      - name: Provenance completeness (E11)
        run: |
          python3 -m pip install --quiet openpyxl || true
          bash docs/build-provenance/check-provenance.sh
