# Convention Gates - AI-CODING-CONVENTIONS.md v2 §18 + Agentic Build Framework v1.6.
# CI runs the SINGLE canonical gate script (scripts/ci-gates.sh) - the EXACT same
# script the pre-push hook runs locally - so CI and local can never drift (v1.6 §1).
# It fails on: type errors, NEW size/ratchet violations, lint errors in changed
# files, untested new code or a surviving mutant (E13), a NEW unwired module beyond
# the wiring baseline (E14), or a stale provenance log (E11). Integration /
# testcontainers suites run in their OWN lane (npm run test:integration).

name: Convention Gates

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  gates:
    name: canonical gate (scripts/ci-gates.sh ci)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changed-file gates diff against the PR base

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Provenance deps (E11 uses openpyxl)
        run: python3 -m pip install --quiet openpyxl || true

      - name: Convention Gates (all tiers)
        env:
          GATE_BASE: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci-gates.sh ci

  # Order-pollution detector (Framework v1.6 residual): run the unit suite in a
  # RANDOMIZED order to surface shared-state / test-isolation bugs a fixed order
  # hides. Nightly + on-demand only, so it never slows a PR.
  shuffle:
    name: test isolation (shuffled order)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - run: npm run test:shuffle
